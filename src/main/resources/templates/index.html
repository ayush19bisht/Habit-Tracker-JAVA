<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker | Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.9);
            --primary-grad: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            min-height: 100vh;
            color: #2d3436;
        }

        .navbar-custom {
            background: var(--primary-grad);
            padding: 1.5rem 0;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            transition: transform 0.2s;
        }

        .input-group-custom {
            background: white;
            border-radius: 50px;
            padding: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .input-group-custom input {
            border: none;
            padding-left: 20px;
        }

        .input-group-custom input:focus {
            box-shadow: none;
        }

        .btn-add {
            background: var(--primary-grad);
            color: white;
            border-radius: 50px;
            padding: 10px 30px;
            border: none;
        }

        .table thead {
            background: #f8f9fa;
            border-radius: 12px;
        }

        .table th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: #636e72;
            border: none;
        }

        .progress {
            height: 12px;
            border-radius: 20px;
            background-color: #eee;
        }

        .day-box {
            min-width: 60px;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .day-active {
            background: #00b894 !important;
            box-shadow: 0 4px 12px rgba(0, 184, 148, 0.3);
        }

        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
    </style>
</head>

<body>

<nav class="navbar-custom">
    <div class="container d-flex justify-content-between align-items-center">
        <h2 class="m-0 text-white" style="font-family: 'Poppins', sans-serif;">
            <i class="bi bi-fire me-2"></i>Habit Tracker
        </h2>
        <a href="/login" class="btn btn-outline-light px-4 rounded-pill">Logout</a>
    </div>
</nav>

<div class="container mb-5">

    <div class="row justify-content-center mb-5">
        <div class="col-lg-10">
            <div class="card p-3">
                <form action="/add" method="post">
                    <div class="row g-2 align-items-center">
                        <div class="col-md-5">
                            <input type="text" name="name" class="form-control border-0 bg-light rounded-pill px-4" placeholder="What habit are we starting?" required>
                        </div>
                        <div class="col-md-4">
                            <input type="text" name="category" class="form-control border-0 bg-light rounded-pill px-4" placeholder="Category (e.g. Health)">
                        </div>
                        <div class="col-md-3 d-grid">
                            <button class="btn btn-add shadow-sm">
                                <i class="bi bi-plus-lg me-2"></i>Add Habit
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card p-4 h-100">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="m-0 fw-bold">Active Habits</h5>
                    <span class="badge bg-soft-primary text-primary" th:text="${#lists.size(habits) + ' Total'}"></span>
                </div>
                
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>Habit</th>
                                <th>Category</th>
                                <th>Current Streak</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="h : ${habits}">
                                <td>
                                    <span class="fw-bold" th:text="${h.name}"></span>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark rounded-pill px-3" th:text="${h.category}"></span>
                                </td>
                                <td style="width: 30%;">
                                    <div class="d-flex align-items-center gap-2">
                                        <div class="progress flex-grow-1">
                                            <div class="progress-bar bg-primary" 
                                                 role="progressbar" 
                                                 th:style="'width:' + (${h.currentStreak} * 10) + '%'"></div>
                                        </div>
                                        <small class="fw-bold" th:text="${h.currentStreak}"></small>
                                    </div>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{/done/{id}(id=${h.id})}" class="btn btn-sm btn-success rounded-pill px-3 me-1">
                                        <i class="bi bi-check2"></i>
                                    </a>
                                    <a th:href="@{/delete/{id}(id=${h.id})}" class="btn btn-sm btn-outline-danger rounded-pill px-3">
                                        <i class="bi bi-trash3"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div th:if="${#lists.isEmpty(habits)}" class="text-center py-5">
                    <i class="bi bi-clipboard2-plus text-muted" style="font-size: 3rem;"></i>
                    <p class="text-muted mt-3">No habits added yet. Start your journey today!</p>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card p-4 mb-4">
                <h5 class="fw-bold mb-3"><i class="bi bi-calendar3 me-2"></i>Weekly Goal</h5>
                <div class="d-flex justify-content-between gap-1">

    <div th:each="i : ${#numbers.sequence(1,7)}"
         th:class="'p-2 rounded text-center day-box ' + 
                   (${!#lists.isEmpty(habits) and i <= habits[0].currentStreak} 
                   ? 'day-active text-white' : 'bg-light')">

        <small th:text="${i == 1 ? 'M' :
                         i == 2 ? 'T' :
                         i == 3 ? 'W' :
                         i == 4 ? 'T' :
                         i == 5 ? 'F' :
                         i == 6 ? 'S' : 'S'}"></small>

    </div>

</div>
            </div>

            <div class="card p-4">
                <h5 class="fw-bold mb-3"><i class="bi bi-bar-chart-line me-2"></i>Analytics</h5>
                <div class="chart-container">
                    <canvas id="habitChart"></canvas>
                </div>
            </div>
            <div class="card p-4 mt-4">
    <h5 class="fw-bold mb-3">
        <i class="bi bi-calendar-month me-2"></i>Monthly Progress
    </h5>

    <div class="d-flex flex-wrap gap-2">

        <div th:each="i : ${#numbers.sequence(1,30)}"
             th:class="'p-2 rounded text-center day-box ' +
             (${!#lists.isEmpty(habits) and i <= habits[0].currentStreak}
             ? 'day-active text-white' : 'bg-light')"
             style="width:45px;">

            <small th:text="${i}"></small>

        </div>

    </div>
</div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script th:inline="javascript">
    // Securely fetching data from Thymeleaf
    const habitsData = /*[[${habits}]]*/ [];
    
    if (habitsData && habitsData.length > 0) {
        const names = habitsData.map(h => h.name);
        const streaks = habitsData.map(h => h.currentStreak);

        const ctx = document.getElementById('habitChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: names,
                datasets: [{
                    label: 'Current Streak',
                    data: streaks,
                    backgroundColor: '#667eea',
                    borderRadius: 8,
                    barThickness: 20
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    y: {
                   beginAtZero: true,
                   max: 10,
                   ticks: {
                   stepSize: 1
    },
    grid: {
        display: false
    }
},
                    x: {
                        grid: { display: false }
                    }
                }
            }
        });
    }
</script>
</body>
</html>
